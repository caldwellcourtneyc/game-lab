<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WordDrops</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0c0c1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  canvas {
    display: block;
    touch-action: none;
  }

  /* Word found animation */
  .word-popup {
    position: fixed;
    font-size: 1.5rem;
    font-weight: bold;
    color: #ffd93d;
    text-shadow: 0 0 20px rgba(255, 217, 61, 0.5);
    pointer-events: none;
    animation: popUp 1.5s forwards;
    z-index: 50;
  }

  @keyframes popUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
  }

  /* Screen shake */
  /* Magnitude scales with --shk (set per-clear by triggerShake): longer words / deeper chains shake harder */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    10% { transform: translateX(calc(var(--shk, 1) * -5px)) rotate(calc(var(--shk, 1) * -0.5deg)); }
    30% { transform: translateX(calc(var(--shk, 1) * 5px)) rotate(calc(var(--shk, 1) * 0.5deg)); }
    50% { transform: translateX(calc(var(--shk, 1) * -3px)); }
    70% { transform: translateX(calc(var(--shk, 1) * 3px)); }
    90% { transform: translateX(calc(var(--shk, 1) * -1px)); }
  }

  canvas.shake { animation: shake 0.4s; }
</style>
</head>
<body>

<canvas id="game"></canvas>

// WORD DROPS — Sprint 1: Core Rewrite
// State machine, two modes, player-controlled clearing
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ── Responsive Canvas ──────────────────────────────────────
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W, H, CELL, PADDING_X, PADDING_Y;
let BOARD_PIXEL_X, BOARD_PIXEL_Y, BOARD_PIXEL_W, BOARD_PIXEL_H;

const COLS = 8;
const ROWS = 13;

function resizeCanvas() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // Calculate cell size to fit board with padding
  const maxBoardW = W - 20;
  const maxBoardH = H - 120; // leave room for HUD top bar
  CELL = Math.floor(Math.min(maxBoardW / COLS, maxBoardH / ROWS));
  CELL = Math.min(CELL, 48); // cap cell size on desktop

  const boardW = COLS * CELL;
  const boardH = ROWS * CELL;
  BOARD_PIXEL_X = Math.floor((W - boardW) / 2);
  BOARD_PIXEL_Y = Math.floor((H - boardH) / 2) + 30; // offset for HUD
  BOARD_PIXEL_W = boardW;
  BOARD_PIXEL_H = boardH;
  PADDING_X = BOARD_PIXEL_X;
  PADDING_Y = BOARD_PIXEL_Y;
}

resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ── Letter Data ────────────────────────────────────────────
const LETTER_POOL = {
  'A': { freq: 9, pts: 1 }, 'B': { freq: 2, pts: 3 }, 'C': { freq: 3, pts: 3 },
  'D': { freq: 4, pts: 2 }, 'E': { freq: 12, pts: 1 }, 'F': { freq: 2, pts: 4 },
  'G': { freq: 3, pts: 2 }, 'H': { freq: 3, pts: 4 }, 'I': { freq: 9, pts: 1 },
  'J': { freq: 1, pts: 8 }, 'K': { freq: 1, pts: 5 }, 'L': { freq: 4, pts: 1 },
  'M': { freq: 3, pts: 3 }, 'N': { freq: 6, pts: 1 }, 'O': { freq: 8, pts: 1 },
  'P': { freq: 3, pts: 3 }, 'Q': { freq: 1, pts: 10 }, 'R': { freq: 6, pts: 1 },
  'S': { freq: 6, pts: 1 }, 'T': { freq: 6, pts: 1 }, 'U': { freq: 4, pts: 1 },
  'V': { freq: 2, pts: 4 }, 'W': { freq: 2, pts: 4 }, 'X': { freq: 1, pts: 8 },
  'Y': { freq: 2, pts: 4 }, 'Z': { freq: 1, pts: 10 }
};

let LETTERS = [];
for (let [letter, data] of Object.entries(LETTER_POOL)) {
  for (let i = 0; i < data.freq; i++) LETTERS.push(letter);
}

const LETTER_COLORS = {
  1: '#4d96ff', 2: '#6bcb77', 3: '#ffd93d',
  4: '#ff6b6b', 5: '#bc8cff', 8: '#ff9a3c', 10: '#ff4757'
};

function getLetterColor(letter) {
  return LETTER_COLORS[LETTER_POOL[letter].pts] || '#4d96ff';
}

function lightenColor(hex, amount) {
  const r = Math.min(255, parseInt(hex.slice(1, 3), 16) + amount);
  const g = Math.min(255, parseInt(hex.slice(3, 5), 16) + amount);
  const b = Math.min(255, parseInt(hex.slice(5, 7), 16) + amount);
  return `rgb(${r},${g},${b})`;
}

function darkenColor(hex, amount) {
  const r = Math.max(0, parseInt(hex.slice(1, 3), 16) - amount);
  const g = Math.max(0, parseInt(hex.slice(3, 5), 16) - amount);
  const b = Math.max(0, parseInt(hex.slice(5, 7), 16) - amount);
  return `rgb(${r},${g},${b})`;
}

// ── Mulberry32 PRNG (deterministic) ────────────────────────
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function getDailySeed() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

function getTodayString() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// Day number since an arbitrary epoch for display
function getDayNumber() {
  const epoch = new Date(2026, 0, 1);
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.floor((now - epoch) / 86400000) + 1;
}

// ── Persistence ────────────────────────────────────────────
const STORAGE = {
  get(key) { try { return localStorage.getItem('gamelab_worddrops_' + key); } catch { return null; } },
  set(key, val) { try { localStorage.setItem('gamelab_worddrops_' + key, val); } catch {} },
  getJSON(key) { try { return JSON.parse(this.get(key)); } catch { return null; } },
  setJSON(key, val) { this.set(key, JSON.stringify(val)); }
};

function loadStats() {
  return {
    dailyStreak: parseInt(STORAGE.get('daily_streak')) || 0,
    dailyLastPlayed: STORAGE.get('daily_last_played') || '',
    dailyBestScore: parseInt(STORAGE.get('daily_best_score')) || 0,
    dailyTodayResult: STORAGE.getJSON('daily_today_result'),
    freeplayBestScore: parseInt(STORAGE.get('freeplay_best_score')) || 0,
    freeplayGamesPlayed: parseInt(STORAGE.get('freeplay_games_played')) || 0,
  };
}

function saveDailyResult(result) {
  const today = getTodayString();
  const stats = loadStats();

  // Update streak
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yStr = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;

  let newStreak;
  if (stats.dailyLastPlayed === yStr) {
    newStreak = stats.dailyStreak + 1;
  } else if (stats.dailyLastPlayed === today) {
    newStreak = stats.dailyStreak; // already played today
  } else {
    newStreak = 1; // streak broken or first play
  }

  STORAGE.set('daily_streak', newStreak);
  STORAGE.set('daily_last_played', today);
  if (result.score > stats.dailyBestScore) {
    STORAGE.set('daily_best_score', result.score);
  }
  STORAGE.setJSON('daily_today_result', result);
}

function saveFreeplayResult(score) {
  const stats = loadStats();
  STORAGE.set('freeplay_games_played', stats.freeplayGamesPlayed + 1);
  if (score > stats.freeplayBestScore) {
    STORAGE.set('freeplay_best_score', score);
  }
}

// ── Scoring ────────────────────────────────────────────────
const LENGTH_MULTIPLIER = { 3: 1, 4: 2, 5: 4, 6: 8, 7: 16, 8: 32 };
function getWordScore(word, chainLength) {
  let base = 0;
  for (let ch of word) base += LETTER_POOL[ch].pts;
  const lenMult = LENGTH_MULTIPLIER[Math.min(word.length, 8)] || 32;
  const chainMult = chainLength > 0 ? Math.pow(1.5, chainLength) : 1;
  return Math.floor(base * lenMult * chainMult);
}

// ── Board Helpers ──────────────────────────────────────────
function createBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) {
    board[r] = [];
    for (let c = 0; c < COLS; c++) board[r][c] = null;
  }
}

function applyGravity() {
  let moved = false;
  for (let c = 0; c < COLS; c++) {
    let write = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r][c] !== null) {
        if (write !== r) {
          board[write][c] = board[r][c];
          board[r][c] = null;
          moved = true;
        }
        write--;
      }
    }
    for (let r = write; r >= 0; r--) board[r][c] = null;
  }
  return moved;
}

// ── Word Detection (scan board, return all valid words) ────
function scanBoard() {
  let found = [];

  // Horizontal (left to right)
  for (let r = 0; r < ROWS; r++) {
    for (let startC = 0; startC < COLS - 2; startC++) {
      if (board[r][startC] === null) continue;
      let word = '';
      let cells = [];
      for (let c = startC; c < COLS && board[r][c] !== null; c++) {
        word += board[r][c];
        cells.push({ r, c });
        if (word.length >= 3 && DICTIONARY.has(word)) {
          found.push({ word, cells: [...cells], direction: 'h' });
        }
      }
    }
  }

  // Vertical (top to bottom)
  for (let c = 0; c < COLS; c++) {
    for (let startR = 0; startR < ROWS - 2; startR++) {
      if (board[startR][c] === null) continue;
      let word = '';
      let cells = [];
      for (let r = startR; r < ROWS && board[r][c] !== null; r++) {
        word += board[r][c];
        cells.push({ r, c });
        if (word.length >= 3 && DICTIONARY.has(word)) {
          found.push({ word, cells: [...cells], direction: 'v' });
        }
      }
    }
  }

  return found;
}

// Track known highlighted words so we only play sound/flash for NEW discoveries
let knownHighlightKeys = new Set();

function makeWordKey(w) {
  return w.word + ':' + w.cells.map(c => c.r + ',' + c.c).join(';');
}

function setHighlights(found) {
  const newKeys = new Set(found.map(makeWordKey));
  let hasNew = false;
  highlightedWords = found.map(w => {
    const key = makeWordKey(w);
    const isNew = !knownHighlightKeys.has(key);
    if (isNew) hasNew = true;
    return { ...w, glowPhase: 0, isNew, discoveryTimer: isNew ? 1.0 : 0 };
  });
  knownHighlightKeys = newKeys;
  if (hasNew && found.length > 0 && typeof sfxWordHighlight === 'function') sfxWordHighlight();
}

function updateHighlights() {
  const found = scanBoard();
  setHighlights(found);
}

// ── Clear a specific word ──────────────────────────────────
function clearWord(wordObj) {
  if (clearingAnimation) return;
  clearingAnimation = true;

  const wordScore = getWordScore(wordObj.word, chainCount);
  scoreVal += wordScore;
  wordsFound++;

  if (wordObj.word.length > longestWord.length) longestWord = wordObj.word;
  if (wordScore > bestWordScore) { bestWordScore = wordScore; bestWord = wordObj.word; }
  if (chainCount > bestChain) bestChain = chainCount;

  wordHistory.unshift({ word: wordObj.word, score: wordScore });
  if (wordHistory.length > 15) wordHistory.pop();

  // Show popup
  showWordPopup(wordObj.word, wordScore, wordObj.cells[0]);
  sfxWordClear(wordObj.word.length, chainCount);
  triggerReleaseAmbient();

  // Screen shake scaled by word length and chain depth (§3.2): short non-chained clears
  // don't shake; long words and deep chains hit hard.
  const shakeIntensity = Math.max(0, (wordObj.word.length - 4) * 0.4) + chainCount * 0.3;
  if (shakeIntensity > 0.15) triggerShake(0.5 + shakeIntensity);

  // Particles + clear cells
  for (let cell of wordObj.cells) {
    let letter = board[cell.r][cell.c];
    if (letter) spawnParticles(cell.r, cell.c, getLetterColor(letter));
    board[cell.r][cell.c] = null;
  }

  // After a short delay: gravity, re-scan, chain check
  setTimeout(() => {
    applyGravity();

    // Re-scan for chain
    const newWords = scanBoard();
    if (newWords.length > 0) {
      chainCount++;
      if (chainCount > bestChain) bestChain = chainCount;
      setHighlights(newWords);
      if (typeof sfxChainContinue === 'function') sfxChainContinue(chainCount);
    } else {
      chainCount = 0;
      highlightedWords = [];
      knownHighlightKeys = new Set();
      // After chain ends, do a fresh scan (in case letters settled into new words)
      updateHighlights();
    }

    clearingAnimation = false;

    // A clear can be the last possible action on a full Daily board — re-check for jam.
    checkDailyJam();

    // Level up in freeplay
    if (gameMode === 'freeplay' && wordsFound > 0 && wordsFound % 10 === 0) {
      level = Math.floor(wordsFound / 10) + 1;
      dropInterval = Math.max(400, 1000 - (level - 1) * 40);
      sfxLevelUp();
    }
  }, 250);
}

// ── Hit test: which highlighted word was tapped? ───────────
function getWordAtCell(r, c) {
  // Prefer longer words when multiple occupy same cell
  let best = null;
  for (let hw of highlightedWords) {
    for (let cell of hw.cells) {
      if (cell.r === r && cell.c === c) {
        if (!best || hw.word.length > best.word.length) best = hw;
      }
    }
  }
  return best;
}

// ── Particles & Effects ────────────────────────────────────
function spawnParticles(r, c, color) {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x: PADDING_X + c * CELL + CELL / 2,
      y: PADDING_Y + r * CELL + CELL / 2,
      vx: (Math.random() - 0.5) * 120,
      vy: (Math.random() - 0.5) * 120 - 30,
      life: 0.6 + Math.random() * 0.3,
      color, size: 3 + Math.random() * 3
    });
  }
}

// intensity ~0.5 (small word) .. ~2.2 (long word + deep chain). Restarts the CSS animation
// even on rapid consecutive clears via a forced reflow.
function triggerShake(intensity = 1) {
  const shk = Math.max(0.4, Math.min(2.2, intensity));
  canvas.classList.remove('shake');
  void canvas.offsetWidth;
  canvas.style.setProperty('--shk', shk.toFixed(2));
  canvas.classList.add('shake');
  clearTimeout(triggerShake._t);
  triggerShake._t = setTimeout(() => canvas.classList.remove('shake'), 420);
}

function showWordPopup(word, score, cell) {
  let popup = document.createElement('div');
  popup.className = 'word-popup';
  popup.textContent = `${word} +${score}`;
  let rect = canvas.getBoundingClientRect();
  popup.style.left = (rect.left + PADDING_X + cell.c * CELL) + 'px';
  popup.style.top = (rect.top + PADDING_Y + cell.r * CELL) + 'px';
  document.body.appendChild(popup);
  setTimeout(() => popup.remove(), 1500);
}

// ── Random Letter (mode-aware) ─────────────────────────────
// Anti-drought dealing (§4.2): draws stay frequency-weighted, but we cap same-class streaks.
// A pure random stream strands players in consonant deserts by variance. Vowels are capped
// tighter (floods aren't useful for building words) while consonant runs are allowed to go
// longer for challenge. Freeplay only; tune the caps to taste.
const VOWELS = new Set(['A', 'E', 'I', 'O', 'U']);
const MAX_VOWEL_RUN = 3;
const MAX_CONSONANT_RUN = 6;
let letterRun = 0;          // length of the current same-class streak
let letterRunIsVowel = null;

function resetLetterRun() { letterRun = 0; letterRunIsVowel = null; }

// Frequency-weighted pick, optionally restricted to one class.
function weightedLetter(forceVowel, forceConsonant) {
  let ch;
  do {
    ch = LETTERS[Math.floor(Math.random() * LETTERS.length)];
  } while ((forceVowel && !VOWELS.has(ch)) || (forceConsonant && VOWELS.has(ch)));
  return ch;
}

function randomLetter() {
  let forceVowel = false, forceConsonant = false;
  if (letterRunIsVowel === true && letterRun >= MAX_VOWEL_RUN) forceConsonant = true;
  else if (letterRunIsVowel === false && letterRun >= MAX_CONSONANT_RUN) forceVowel = true;
  const ch = weightedLetter(forceVowel, forceConsonant);
  const isV = VOWELS.has(ch);
  if (isV === letterRunIsVowel) letterRun++;
  else { letterRunIsVowel = isV; letterRun = 1; }
  return ch;
}

// Daily uses the plain seeded stream (mode currently disabled; see DAILY_ENABLED). If Daily is
// ever re-enabled, applying the same cap here would need per-run state reset to stay deterministic.
function dailyRandomLetter() {
  if (!dailyRNG) return randomLetter();
  return LETTERS[Math.floor(dailyRNG() * LETTERS.length)];
}

// ── Game Init ──────────────────────────────────────────────
function initFreeplay() {
  gameMode = 'freeplay';
  state = 'playing';
  createBoard();
  highlightedWords = [];
  knownHighlightKeys = new Set();
  scoreVal = 0; displayScore = 0; wordsFound = 0; chainCount = 0;
  bestWord = ''; bestWordScore = 0; longestWord = '';
  bestChain = 0; wordHistory = []; totalLettersPlaced = 0;
  particles = []; level = 1; dropInterval = 1000;
  heldLetter = null; canHold = true;
  clearingAnimation = false;

  resetLetterRun();
  nextLetters = [randomLetter(), randomLetter(), randomLetter()];
  spawnFreeplayLetter();

  unlockAudio();
  WD_AMBIENT.start();
  updateAmbientFromBoard();

  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function spawnFreeplayLetter() {
  currentLetter = nextLetters.shift();
  nextLetters.push(randomLetter());
  letterX = Math.floor(COLS / 2);
  letterY = 0;
  canHold = true;

  if (board[0][letterX] !== null) {
    endGame();
  }
}

function initDaily() {
  const stats = loadStats();
  const today = getTodayString();

  // Already played today?
  if (stats.dailyTodayResult && stats.dailyLastPlayed === today) {
    // Show results directly
    showDailyResults(stats.dailyTodayResult, stats.dailyStreak);
    return;
  }

  gameMode = 'daily';
  state = 'playing';
  createBoard();
  highlightedWords = [];
  scoreVal = 0; displayScore = 0; wordsFound = 0; chainCount = 0;
  bestWord = ''; bestWordScore = 0; longestWord = '';
  bestChain = 0; wordHistory = []; totalLettersPlaced = 0;
  particles = []; clearingAnimation = false;

  dailyRNG = mulberry32(getDailySeed());
  dailyLetterIndex = 0;
  dailyTimer = 180;
  dailyTimerActive = false;
  dailyStarted = false;
  dailyLetter = dailyRandomLetter();
  dailyQueue = [];
  for (let i = 0; i < DAILY_QUEUE_SIZE; i++) dailyQueue.push(dailyRandomLetter());

  knownHighlightKeys = new Set();
  unlockAudio();
  WD_AMBIENT.start();
  updateAmbientFromBoard();

  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

// ── Place letter (Daily mode) ──────────────────────────────
function placeDailyLetter(col) {
  if (clearingAnimation) return;
  if (col < 0 || col >= COLS) return;

  // Find lowest empty cell in column
  let targetRow = -1;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r][col] === null) { targetRow = r; break; }
  }
  if (targetRow === -1) return; // column full

  // Start timer on first placement
  if (!dailyTimerActive) {
    dailyTimerActive = true;
    dailyStarted = true;
  }

  board[targetRow][col] = dailyLetter;
  totalLettersPlaced++;
  sfxLetterLand(col);

  // Advance letter queue
  dailyLetterIndex++;
  dailyLetter = dailyQueue.shift();
  dailyQueue.push(dailyRandomLetter());

  // Scan for words
  updateHighlights();

  // Daily can jam: if that placement filled the board and nothing is left to clear, the
  // player can't act while the clock runs — end the run cleanly instead of a silent stall.
  checkDailyJam();
}

// True when no cell is empty anywhere — no column can accept a dropped letter.
function isBoardFull() {
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (board[r][c] === null) return false;
  return true;
}

// End a Daily run only when the board is full AND there are no glowing words left to clear
// (clearing a word opens space — that's the built-in relief, so we don't cut it short).
function checkDailyJam() {
  if (gameMode === 'daily' && state === 'playing' && !clearingAnimation
      && highlightedWords.length === 0 && isBoardFull()) {
    endGame('boardfull');
  }
}

// ── Place letter (Freeplay mode) ───────────────────────────
function placeFreeplayLetter() {
  if (clearingAnimation) return;

  board[letterY][letterX] = currentLetter;
  totalLettersPlaced++;
  sfxLetterLand(letterX);

  // Scan for words
  updateHighlights();

  spawnFreeplayLetter();
}

// ── Hold Letter (Freeplay) ─────────────────────────────────
function holdLetter() {
  if (!canHold || state !== 'playing' || gameMode !== 'freeplay') return;
  canHold = false;

  if (heldLetter) {
    let temp = heldLetter;
    heldLetter = currentLetter;
    currentLetter = temp;
    letterY = 0;
    letterX = Math.floor(COLS / 2);
  } else {
    heldLetter = currentLetter;
    spawnFreeplayLetter();
  }
}

// ── End Game ───────────────────────────────────────────────
// reason: 'time' (Daily clock ran out) | 'boardfull' (Daily jammed) | undefined (Freeplay top-out)
function endGame(reason) {
  state = 'game_over';
  WD_AMBIENT.stop();

  // Check for personal best before saving (so we can compare)
  const stats = loadStats();
  const isPB = (gameMode === 'daily' && scoreVal > stats.dailyBestScore) ||
               (gameMode === 'freeplay' && scoreVal > stats.freeplayBestScore);

  if (gameMode === 'daily') {
    // Auto-clear all remaining highlighted words as final bonus
    for (let hw of highlightedWords) {
      const wordScore = getWordScore(hw.word, 0);
      scoreVal += wordScore;
      wordsFound++;
      if (hw.word.length > longestWord.length) longestWord = hw.word;
      for (let cell of hw.cells) {
        if (board[cell.r][cell.c]) {
          spawnParticles(cell.r, cell.c, getLetterColor(board[cell.r][cell.c]));
          board[cell.r][cell.c] = null;
        }
      }
    }
    highlightedWords = [];

    const result = {
      score: scoreVal,
      words: wordsFound,
      longest: longestWord,
      bestWord: bestWord,
      bestWordScore: bestWordScore,
      history: wordHistory.slice(0, 15),
      bestChain: bestChain,
      lettersPlaced: totalLettersPlaced,
      endReason: reason || 'time',
      played: true
    };

    saveDailyResult(result);
    const stats = loadStats();
    showDailyResults(result, stats.dailyStreak);
  } else {
    saveFreeplayResult(scoreVal);
  }

  if (isPB && scoreVal > 0) sfxPersonalBest();
  else sfxGameOver();
}

function showDailyResults(result, streak) {
  // Stored for drawing in game_over state
  state = 'game_over';
  gameMode = 'daily';
  dailyResult = result;
  dailyStreak = streak;
}

let dailyResult = null;
let dailyStreak = 0;

// ── Input Handling ─────────────────────────────────────────
function getCellFromPos(x, y) {
  const col = Math.floor((x - PADDING_X) / CELL);
  const row = Math.floor((y - PADDING_Y) / CELL);
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return null;
  return { r: row, c: col };
}

function getColumnFromX(x) {
  const col = Math.floor((x - PADDING_X) / CELL);
  if (col < 0 || col >= COLS) return -1;
  return col;
}

// Touch handlers
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  touchStartX = touch.clientX - rect.left;
  touchStartY = touch.clientY - rect.top;
  touchStartTime = performance.now();

  if (state === 'playing' && gameMode === 'daily') {
    hoveredCol = getColumnFromX(touchStartX);
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const x = touch.clientX - rect.left;

  if (state === 'playing' && gameMode === 'daily') {
    hoveredCol = getColumnFromX(x);
  }

  if (state === 'playing' && gameMode === 'freeplay') {
    const y = touch.clientY - rect.top;
    const dx = x - touchStartX;
    const dy = y - touchStartY;

    // Horizontal swipe: move piece
    if (Math.abs(dx) > CELL * 0.6) {
      if (dx > 0 && letterX < COLS - 1 && board[letterY][letterX + 1] === null) {
        letterX++;
        touchStartX = x;
      } else if (dx < 0 && letterX > 0 && board[letterY][letterX - 1] === null) {
        letterX--;
        touchStartX = x;
      }
    }

    // Vertical swipe down: soft drop
    if (dy > CELL * 0.6) {
      if (letterY + 1 < ROWS && board[letterY + 1][letterX] === null) {
        letterY++;
        touchStartY = y;
        dropTimer = 0;
      }
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  const elapsed = performance.now() - touchStartTime;

  handleClick(touchStartX, touchStartY, elapsed < 300);
  hoveredCol = -1;
}, { passive: false });

// Mouse handlers
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  handleClick(e.clientX - rect.left, e.clientY - rect.top, true);
});

function handleClick(x, y, isTap) {
  // Sound toggle — top-right corner, always active
  const iconSize = 24;
  const iconX = W - iconSize - 10;
  const iconY = 4;
  if (x >= iconX && x <= iconX + iconSize && y >= iconY && y <= iconY + iconSize) {
    toggleSound();
    return;
  }

  // Pause button — top-left, active during play or while paused. Generous hit region.
  if ((state === 'playing' || state === 'paused') &&
      x >= 2 && x <= PAUSE_BTN.x + PAUSE_BTN.s + 8 && y >= 0 && y <= PAUSE_BTN.y + PAUSE_BTN.s + 8) {
    togglePause();
    return;
  }
  // While paused, a tap anywhere else resumes.
  if (state === 'paused') {
    togglePause();
    return;
  }

  if (state === 'howto') {
    STORAGE.set('seen_howto', '1');
    startFromMenu();
    return;
  }

  if (state === 'menu') {
    // How to Play button — must be checked before "tap anywhere to start"
    const hb = getMenuHowToButton();
    if (x >= hb.x && x <= hb.x + hb.w && y >= hb.y && y <= hb.y + hb.h) {
      state = 'howto';
      return;
    }
    startFromMenu();
    return;
  }

  if (state === 'mode_select') {
    handleModeSelectClick(x, y);
    return;
  }

  if (state === 'game_over') {
    handleGameOverClick(x, y);
    return;
  }

  if (state !== 'playing') return;

  // Check if clicking on a highlighted word
  const cell = getCellFromPos(x, y);
  if (cell && !clearingAnimation) {
    const word = getWordAtCell(cell.r, cell.c);
    if (word) {
      clearWord(word);
      return;
    }
    // Tapped an occupied tile that isn't part of a word.
    if (board[cell.r] && board[cell.r][cell.c]) {
      // Daily: you place letters by tapping empty column space and clear words by tapping
      // the glow, so an occupied non-word tile is a mis-tap. Show "not a word" and STOP —
      // falling through to placeDailyLetter was the double-action bug.
      // Freeplay: a tap means hard-drop, so don't hijack it with word-attempt feedback;
      // let it fall through to the hard-drop handler below.
      if (gameMode === 'daily') {
        notWordFeedback = { x: PADDING_X + cell.c * CELL + CELL / 2, y: PADDING_Y + cell.r * CELL, timer: 1.0 };
        playNotWordSound();
        return;
      }
    }
  }

  // Daily mode: tap column to place letter
  if (gameMode === 'daily' && isTap) {
    const col = getColumnFromX(x);
    if (col >= 0) placeDailyLetter(col);
  }

  // Freeplay mode: tap for hard drop
  if (gameMode === 'freeplay' && isTap) {
    // Only hard drop if tap is on/near the board, not on a highlighted word
    if (cell && !getWordAtCell(cell.r, cell.c)) {
      while (letterY + 1 < ROWS && board[letterY + 1][letterX] === null) letterY++;
      placeFreeplayLetter();
      dropTimer = 0;
    }
  }
}

// ── Mode Select Button Positions ───────────────────────────
function getModeSelectButtons() {
  const cx = W / 2;
  const cy = H / 2;
  const btnW = Math.min(260, W - 60);
  const btnH = 70;
  const gap = 20;

  return {
    daily: { x: cx - btnW/2, y: cy - btnH - gap/2, w: btnW, h: btnH },
    freeplay: { x: cx - btnW/2, y: cy + gap/2, w: btnW, h: btnH },
  };
}

function handleModeSelectClick(x, y) {
  const btns = getModeSelectButtons();
  if (x >= btns.daily.x && x <= btns.daily.x + btns.daily.w &&
      y >= btns.daily.y && y <= btns.daily.y + btns.daily.h) {
    initDaily();
  }
  if (x >= btns.freeplay.x && x <= btns.freeplay.x + btns.freeplay.w &&
      y >= btns.freeplay.y && y <= btns.freeplay.y + btns.freeplay.h) {
    initFreeplay();
  }
}

// Game Over buttons
function getGameOverButtons() {
  const cx = W / 2;
  const btnW = Math.min(200, W - 80);
  const btnH = 50;
  const baseY = H / 2 + 120;
  return {
    playAgain: { x: cx - btnW/2, y: baseY, w: btnW, h: btnH },
    menu: { x: cx - btnW/2, y: baseY + btnH + 15, w: btnW, h: btnH },
    share: gameMode === 'daily' ? { x: cx - btnW/2, y: baseY + (btnH + 15) * 2, w: btnW, h: btnH } : null,
  };
}

function handleGameOverClick(x, y) {
  const btns = getGameOverButtons();
  if (x >= btns.playAgain.x && x <= btns.playAgain.x + btns.playAgain.w &&
      y >= btns.playAgain.y && y <= btns.playAgain.y + btns.playAgain.h) {
    if (gameMode === 'daily') {
      initDaily();
    } else {
      initFreeplay();
    }
  }
  if (x >= btns.menu.x && x <= btns.menu.x + btns.menu.w &&
      y >= btns.menu.y && y <= btns.menu.y + btns.menu.h) {
    // With Daily off there's no mode picker — go to the title menu (which routes to Freeplay).
    state = DAILY_ENABLED ? 'mode_select' : 'menu';
  }
  if (btns.share && x >= btns.share.x && x <= btns.share.x + btns.share.w &&
      y >= btns.share.y && y <= btns.share.y + btns.share.h) {
    copyShareText();
  }
}

function copyShareText() {
  if (!dailyResult) return;
  const stats = loadStats();
  const text = `WordDrops Daily #${getDayNumber()}\nScore: ${dailyResult.score.toLocaleString()}\nWords: ${dailyResult.words} | Longest: ${dailyResult.longest || 'N/A'}\nBest Chain: ${dailyResult.bestChain}x\nStreak: ${stats.dailyStreak} day${stats.dailyStreak !== 1 ? 's' : ''}`;
  navigator.clipboard.writeText(text).catch(() => {});
}

// Keyboard
document.addEventListener('keydown', (e) => {
  if (state === 'howto') { STORAGE.set('seen_howto', '1'); startFromMenu(); return; }
  if (state === 'menu') { startFromMenu(); return; }

  // Pause works in both modes and toggles back from paused. Must come before the
  // freeplay-only guard below.
  if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') &&
      (state === 'playing' || state === 'paused')) {
    togglePause();
    e.preventDefault();
    return;
  }

  if (state !== 'playing' || gameMode !== 'freeplay') return;
  if (clearingAnimation) return;

  switch (e.key) {
    case 'ArrowLeft':
      if (letterX > 0 && board[letterY][letterX - 1] === null) letterX--;
      e.preventDefault(); break;
    case 'ArrowRight':
      if (letterX < COLS - 1 && board[letterY][letterX + 1] === null) letterX++;
      e.preventDefault(); break;
    case 'ArrowDown':
      if (letterY + 1 < ROWS && board[letterY + 1][letterX] === null) {
        letterY++; dropTimer = 0;
      }
      e.preventDefault(); break;
    case ' ':
      e.preventDefault();
      while (letterY + 1 < ROWS && board[letterY + 1][letterX] === null) letterY++;
      placeFreeplayLetter(); dropTimer = 0;
      break;
    case 'c': case 'C':
      holdLetter(); break;
  }
});

// ── Drawing ────────────────────────────────────────────────
function drawRoundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawButton(btn, text, gradient1, gradient2, textColor) {
  ctx.save();
  // Glow shadow behind button
  ctx.shadowColor = gradient1;
  ctx.shadowBlur = 12;

  const grad = ctx.createLinearGradient(btn.x, btn.y, btn.x + btn.w, btn.y + btn.h);
  grad.addColorStop(0, gradient1);
  grad.addColorStop(1, gradient2);
  ctx.fillStyle = grad;
  drawRoundedRect(btn.x, btn.y, btn.w, btn.h, 12);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = textColor || '#fff';
  ctx.font = 'bold 18px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, btn.x + btn.w/2, btn.y + btn.h/2);
}

// Falling menu tiles — generated once
let menuTiles = [];
function initMenuTiles() {
  menuTiles = [];
  const letters = 'WORDDROPSABCEFGHIJKLMNQTUVXYZ';
  for (let i = 0; i < 10; i++) {

      speed: 15 + Math.random() * 25,

    });

}

  return { x: W / 2 - w / 2, y: (H / 2 - 40) + 150, w, h };
}

function drawHowToScreen() {
  ctx.fillStyle = '#0c0c1a';
  ctx.fillRect(0, 0, W, H);
  const cx = W / 2;
  const maxW = Math.min(360, W - 40);
  const left = cx - maxW / 2;
  let y = Math.max(56, H / 2 - 210);

  ctx.save();
  ctx.shadowColor = '#ffd93d';
  ctx.shadowBlur = 14;
  ctx.fillStyle = '#ffd93d';
  ctx.font = 'bold 28px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('HOW TO PLAY', cx, y);
  ctx.restore();
  y += 42;

  const section = (color, head, body) => {
    ctx.textAlign = 'left';
    ctx.fillStyle = color;
    ctx.font = 'bold 15px "Segoe UI", sans-serif';
    ctx.fillText(head, left, y);
    y += 22;
    ctx.fillStyle = '#aab';
    ctx.font = '13px "Segoe UI", sans-serif';
    for (const ln of body) { ctx.fillText(ln, left, y); y += 18; }
    y += 12;
  };

  section('#6bcb77', 'Spell words', [
    'Letters drop onto the board. Line up 3 or more',
    'in a row or column to form a word.',
  ]);
  section('#ffd93d', 'Tap the glow to clear', [
    'Valid words light up. Tap the glowing letters to',
    'clear them and score. Longer words score big.',
  ]);
  section('#ff6b6b', 'Chain for more', [
    'After a clear, letters fall and new words can',
    'appear. Keep tapping them to build a chain,',
    'and each link multiplies your score.',
  ]);
  if (DAILY_ENABLED) {
    section('#4d96ff', 'Two ways to play', [
      'Daily: tap a column to aim each drop. 3 minutes,',
      'one shared puzzle a day.',
      'Freeplay: letters fall on their own. Move with',
      'arrows or swipe, drop with space or tap.',
    ]);
  } else {
    section('#4d96ff', 'Controls', [
      'Letters fall on their own. Move them with the',
      'arrow keys or by swiping. Drop instantly with',
      'space or a tap. Pause with P.',
    ]);
  }

  drawButton(getHowToButton(), "LET'S PLAY", '#ff6b6b', '#ffd93d');
}

function drawMenuScreen() {

  // Falling background tiles
  for (let t of menuTiles) {
    t.y += t.speed * 0.016;
    if (t.y > H + 40) { t.y = -40; t.x = Math.random() * W; }

  titleGrad.addColorStop(0, '#ff6b6b');
  titleGrad.addColorStop(0.33, '#ffd93d');
  titleGrad.addColorStop(0.66, '#6bcb77');

  ctx.font = '14px "Segoe UI", sans-serif';

  // Tap to start (pulsing)

function drawGameOverScreen() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2;
  let y = H / 2 - 140;

  // Title with glow
  ctx.save();
  ctx.shadowColor = '#ffd93d';
  ctx.shadowBlur = 15;
  const titleGrad = ctx.createLinearGradient(cx - 100, y, cx + 100, y + 30);
  titleGrad.addColorStop(0, '#ff6b6b');
  titleGrad.addColorStop(0.5, '#ffd93d');
  titleGrad.addColorStop(1, '#6bcb77');
  ctx.fillStyle = titleGrad;
  ctx.font = 'bold 36px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (gameMode === 'daily') {
    ctx.fillText(`Daily #${getDayNumber()}`, cx, y);
  } else {
    ctx.fillText('GAME OVER', cx, y);
  }
  ctx.restore();

  // End-reason subtitle (Daily): distinguish a timed finish from a jammed board.
  if (gameMode === 'daily' && dailyResult) {
    const jammed = dailyResult.endReason === 'boardfull';
    ctx.fillStyle = jammed ? '#ff6b6b' : '#888';
    ctx.font = '14px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(jammed ? 'Board full, no moves left' : "Time's up", cx, y + 22);
  }

  // Stats in rounded rect cards
  y += 50;
  ctx.font = '16px "Segoe UI", sans-serif';
  const result = gameMode === 'daily' && dailyResult ? dailyResult : {
    score: scoreVal, words: wordsFound, longest: longestWord,
    bestChain: bestChain, lettersPlaced: totalLettersPlaced,
    bestWord: bestWord, bestWordScore: bestWordScore, history: wordHistory
  };

  const lines = [
    { label: 'Score', value: result.score.toLocaleString(), color: '#ffd93d' },
    { label: 'Words Found', value: String(result.words), color: '#6bcb77' },
    { label: 'Best Word', value: result.bestWord ? `${result.bestWord}  +${(result.bestWordScore || 0).toLocaleString()}` : (result.longest || 'None'), color: '#bc8cff' },
    { label: 'Best Chain', value: result.bestChain + 'x', color: '#ff6b6b' },
    { label: 'Letters Placed', value: String(result.lettersPlaced), color: '#4d96ff' },
  ];

  if (gameMode === 'daily') {
    const stats = loadStats();
    lines.push({ label: 'Streak', value: stats.dailyStreak + ' day' + (stats.dailyStreak !== 1 ? 's' : ''), color: '#ff9a3c' });
  }

  const cardW = Math.min(280, W - 40);
  const cardH = 24;
  for (let line of lines) {
    // Card background
    ctx.fillStyle = 'rgba(26, 26, 58, 0.6)';
    drawRoundedRect(cx - cardW / 2, y - 14, cardW, cardH, 6);
    ctx.fill();

    ctx.fillStyle = '#666';
    ctx.textAlign = 'right';
    ctx.fillText(line.label + ':', cx - 10, y);
    ctx.fillStyle = line.color;
    ctx.textAlign = 'left';
    ctx.fillText(line.value, cx + 10, y);
    y += 29;
  }

  // Words found this run — a compact top-scorers line (§3.4). The data rides along in the
  // persisted daily result and in wordHistory for Freeplay, so it shows on return visits too.
  const history = (result.history || []).slice().sort((a, b) => b.score - a.score);
  if (history.length) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#777';
    ctx.font = '11px "Segoe UI", sans-serif';
    ctx.fillText('WORDS FOUND', cx, y);
    y += 16;
    ctx.font = '13px "Segoe UI", sans-serif';
    const sep = '   ';
    const shown = [];
    for (const h of history) {
      const test = shown.length ? shown.join(sep) + sep + h.word : h.word;
      if (shown.length && ctx.measureText(test).width > cardW - 30) break; // leave room for "+N"
      shown.push(h.word);
    }
    const extra = history.length - shown.length;
    ctx.fillStyle = '#9a9ab5';
    ctx.fillText(shown.join(sep) + (extra > 0 ? sep + '+' + extra : ''), cx, y);
    y += 10;
  }

  // Buttons
  const btns = getGameOverButtons();

  if (gameMode === 'daily') {
    const stats = loadStats();
    const today = getTodayString();
    if (stats.dailyLastPlayed === today) {
      drawButton(btns.playAgain, 'VIEW RESULTS', '#2a2a4a', '#1a1a35', '#888');
    } else {
      drawButton(btns.playAgain, 'PLAY AGAIN', '#ff6b6b', '#ffd93d');
    }
  } else {
    drawButton(btns.playAgain, 'PLAY AGAIN', '#ff6b6b', '#ffd93d');
  }
  drawButton(btns.menu, 'BACK TO MENU', '#2a2a4a', '#1a1a35', '#aaa');

  if (btns.share) {
    drawButton(btns.share, 'COPY RESULTS', '#4d96ff', '#6bcb77');
  }
}

function drawHUD() {
  // Top bar background
  ctx.fillStyle = 'rgba(12, 12, 26, 0.9)';
  ctx.fillRect(0, 0, W, PADDING_Y - 5);

  const y = 18;

  if (gameMode === 'daily') {
    // Score with glow
    ctx.save();
    ctx.shadowColor = '#ffd93d';
    ctx.shadowBlur = 6;
    ctx.fillStyle = '#ffd93d';
    ctx.font = 'bold 20px "Segoe UI", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(Math.round(displayScore).toLocaleString(), 40, y);
    ctx.restore();

    // Timer
    const mins = Math.floor(dailyTimer / 60);
    const secs = Math.floor(dailyTimer % 60);
    const timerStr = `${mins}:${String(secs).padStart(2, '0')}`;

    // Timer color shifts in last 60s
    if (dailyTimer <= 10) {
      ctx.fillStyle = '#ff4757';
      ctx.font = 'bold 24px "Segoe UI", sans-serif';
    } else if (dailyTimer <= 30) {
      ctx.fillStyle = '#ff6b6b';
      ctx.font = 'bold 22px "Segoe UI", sans-serif';
    } else if (dailyTimer <= 60) {
      ctx.fillStyle = '#ffd93d';
      ctx.font = 'bold 20px "Segoe UI", sans-serif';
    } else {
      ctx.fillStyle = '#aaa';
      ctx.font = 'bold 20px "Segoe UI", sans-serif';
    }
    ctx.textAlign = 'center';
    ctx.fillText(timerStr, W / 2, y);

    // Words count
    ctx.fillStyle = '#6bcb77';
    ctx.font = '14px "Segoe UI", sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(`${wordsFound} words`, W - 15, y - 3);

    // Timer progress bar
    const barW = 120, barH = 3;
    const barX = W / 2 - barW / 2, barY = y + 8;
    const pct = dailyTimer / 180;
    ctx.fillStyle = '#1a1a35';
    ctx.fillRect(barX, barY, barW, barH);
    const barColor = pct > 0.5 ? '#6bcb77' : pct > 0.2 ? '#ffd93d' : '#ff4757';
    ctx.fillStyle = barColor;
    ctx.fillRect(barX, barY, barW * pct, barH);

    // Chain indicator — pulsing
    if (chainCount > 0) {
      const chainAlpha = 0.7 + Math.sin(glowTime * 5) * 0.3;
      ctx.save();
      ctx.globalAlpha = chainAlpha;
      ctx.shadowColor = '#ff6b6b';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#ff6b6b';
      ctx.font = 'bold 18px "Segoe UI", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`${chainCount + 1}x CHAIN`, 40, y + 18);
      ctx.restore();
    }
  } else {
    // Freeplay HUD
    // Score
    ctx.fillStyle = '#ffd93d';
    ctx.font = 'bold 20px "Segoe UI", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(Math.round(displayScore).toLocaleString(), 40, y);

    // Level
    ctx.fillStyle = '#4d96ff';
    ctx.font = '14px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`Level ${level}`, W / 2, y);

    // Words
    ctx.fillStyle = '#6bcb77';
    ctx.font = '14px "Segoe UI", sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(`${wordsFound} words`, W - 15, y);

    // Chain
    if (chainCount > 0) {
      ctx.fillStyle = '#ff6b6b';
      ctx.font = 'bold 14px "Segoe UI", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`${chainCount + 1}x CHAIN`, 40, y + 16);
    }

    // Next letters as mini tiles
    const miniS = Math.floor(CELL * 0.55);
    const nextBaseX = W - 15 - nextLetters.length * (miniS + 2);
    ctx.fillStyle = '#555';
    ctx.font = '9px "Segoe UI", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('NEXT', nextBaseX, y + 12);
    for (let i = 0; i < nextLetters.length; i++) {
      drawLetterTile(nextBaseX + i * (miniS + 2), y + 15, nextLetters[i], 1 - i * 0.15, 0, miniS);
    }

    // Hold as mini tile
    if (heldLetter) {
      ctx.fillStyle = '#555';
      ctx.font = '9px "Segoe UI", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('HOLD', 15, y + 12);
      // Bordered box
      ctx.strokeStyle = '#2a2a4a';
      ctx.lineWidth = 1;
      ctx.strokeRect(14, y + 14, miniS + 4, miniS + 4);
      drawLetterTile(16, y + 16, heldLetter, 1, 0, miniS);
    }
  }
}

function drawBoard() {
  // Build set of highlighted cells for quick lookup
  // Each entry: { glow, discovery } where discovery is 0-1 timer for new words
  const highlightCells = new Map();
  for (let hw of highlightedWords) {
    let glowIntensity = hw.word.length >= 6 ? 1.0 : hw.word.length >= 5 ? 0.8 : 0.6;
    // Boost glow for newly discovered words
    if (hw.discoveryTimer > 0) glowIntensity = Math.min(1.0, glowIntensity + 0.4);
    for (let cell of hw.cells) {
      const key = `${cell.r},${cell.c}`;
      const existing = highlightCells.get(key);
      if (!existing || glowIntensity > existing.glow) {
        highlightCells.set(key, { glow: glowIntensity, discovery: hw.discoveryTimer || 0 });
      }
    }
  }

  // Board outer border
  ctx.strokeStyle = '#2a2a50';
  ctx.lineWidth = 2;
  ctx.strokeRect(PADDING_X - 1, PADDING_Y - 1, COLS * CELL + 2, ROWS * CELL + 2);
  ctx.lineWidth = 1;

  // Grid cells
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = PADDING_X + c * CELL;
      const y = PADDING_Y + r * CELL;

      // Cell background
      ctx.fillStyle = (r + c) % 2 === 0 ? '#101025' : '#0e0e20';
      ctx.fillRect(x, y, CELL, CELL);
      ctx.strokeStyle = '#222240';
      ctx.strokeRect(x, y, CELL, CELL);

      // Letter tile
      const letter = board[r][c];
      if (letter) {
        const key = `${r},${c}`;
        const hlInfo = highlightCells.get(key);
        const glow = hlInfo ? hlInfo.glow : 0;
        // Subtle bob on non-glowing tiles
        const bob = glow ? 0 : Math.sin(glowTime * 1.5 + r * 7 + c * 13) * 0.8;
        drawLetterTile(x, y + bob, letter, 1, glow);
        // Discovery flash — bright white overlay that fades out
        if (hlInfo && hlInfo.discovery > 0) {
          const flashAlpha = hlInfo.discovery * 0.35;
          ctx.save();
          ctx.globalAlpha = flashAlpha;
          ctx.fillStyle = '#fff';
          drawRoundedRect(x + 2, y + 2 + bob, CELL - 4, CELL - 4, Math.max(3, CELL * 0.08));
          ctx.fill();
          ctx.restore();
        }
      }
    }
  }

  // Daily mode: column highlight when hovering
  if (gameMode === 'daily' && hoveredCol >= 0 && state === 'playing') {
    const x = PADDING_X + hoveredCol * CELL;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.fillRect(x, PADDING_Y, CELL, ROWS * CELL);

    // Ghost letter position
    let ghostRow = -1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r][hoveredCol] === null) { ghostRow = r; break; }
    }
    if (ghostRow >= 0 && dailyLetter) {
      drawLetterTile(x, PADDING_Y + ghostRow * CELL, dailyLetter, 0.3);
    }
  }

  // Daily mode: current letter + upcoming queue
  if (gameMode === 'daily' && dailyLetter && state === 'playing') {
    const bigSize = Math.floor(CELL * 1.5);
    const bounce = Math.sin(glowTime * 2.5) * 2;
    const lx = W / 2 - bigSize / 2;
    const ly = PADDING_Y - bigSize - 12 + bounce;

    // Glow ring behind current letter
    ctx.save();
    ctx.shadowColor = getLetterColor(dailyLetter);
    ctx.shadowBlur = 18 + Math.sin(glowTime * 3) * 6;
    ctx.beginPath();
    ctx.arc(W / 2, ly + bigSize / 2, bigSize / 2 + 4, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 217, 61, ${0.3 + Math.sin(glowTime * 3) * 0.15})`;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.restore();

    drawLetterTile(lx, ly, dailyLetter, 1, 0, bigSize);

    // "DROP" label
    ctx.fillStyle = '#aaa';
    ctx.font = 'bold 13px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('DROP', W / 2, ly - 6);

    // Upcoming queue — mini tiles to the right
    if (dailyQueue.length > 0) {
      const miniSize = Math.floor(CELL * 0.65);
      const queueStartX = W / 2 + bigSize / 2 + 14;
      const queueY = ly + (bigSize - miniSize) / 2;

      ctx.fillStyle = '#555';
      ctx.font = '9px "Segoe UI", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('NEXT', queueStartX, queueY - 4);

      for (let i = 0; i < dailyQueue.length; i++) {
        const fadeAlpha = 1 - i * 0.15;
        drawLetterTile(queueStartX + i * (miniSize + 3), queueY, dailyQueue[i], fadeAlpha, 0, miniSize);
      }
    }
  }

  // Freeplay: ghost + current falling letter
  if (gameMode === 'freeplay' && currentLetter && state === 'playing') {
    // Ghost
    let ghostY = letterY;
    while (ghostY + 1 < ROWS && board[ghostY + 1][letterX] === null) ghostY++;
    if (ghostY !== letterY) {
      drawLetterTile(PADDING_X + letterX * CELL, PADDING_Y + ghostY * CELL, currentLetter, 0.2);
    }
    // Current
    drawLetterTile(PADDING_X + letterX * CELL, PADDING_Y + letterY * CELL, currentLetter, 1);
  }

  // Danger zone — driven by real death proximity (getDeathProximity), the same signal the
  // ambient "danger" audio uses, so the red glow and the scary sound both agree with when
  // you actually top out (Freeplay) or jam the board (Daily).
  const danger = getDeathProximity();
  if (danger > 0) {
    const dangerAlpha = danger * 0.35;
    for (let r = 0; r < 3; r++) {
      ctx.fillStyle = `rgba(255, 60, 60, ${dangerAlpha * (3 - r) / 3})`;
      ctx.fillRect(PADDING_X, PADDING_Y + r * CELL, COLS * CELL, CELL);
    }
  }
}

function drawLetterTile(x, y, letter, alpha, glowIntensity, size) {
  const s = size || CELL;
  const color = getLetterColor(letter);
  const pts = LETTER_POOL[letter].pts;
  const pad = 2;
  const r = Math.max(3, s * 0.08); // corner radius

  ctx.save();
  ctx.globalAlpha = alpha;

  // Glow effect for highlighted words
  if (glowIntensity) {
    const glowPulse = 0.5 + Math.sin(glowTime * 4) * 0.3;
    const glowAlpha = glowIntensity * glowPulse * alpha;

    ctx.shadowColor = color;
    ctx.shadowBlur = 15 + glowIntensity * 10;

    drawRoundedRect(x + pad, y + pad, s - pad * 2, s - pad * 2, r);
    ctx.strokeStyle = `rgba(255, 255, 255, ${glowAlpha})`;
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;

    // Breathing scale
    const breathe = 1.0 + Math.sin(glowTime * 4) * 0.02;
    const cx = x + s / 2, cy = y + s / 2;
    ctx.translate(cx, cy);
    ctx.scale(breathe, breathe);
    ctx.translate(-cx, -cy);
  }

  // Tile background — radial gradient
  const cx = x + s * 0.4, cy = y + s * 0.35;
  const grad = ctx.createRadialGradient(cx, cy, 0, x + s / 2, y + s / 2, s * 0.75);
  grad.addColorStop(0, lightenColor(color, 50));
  grad.addColorStop(0.6, color);
  grad.addColorStop(1, darkenColor(color, 30));

  drawRoundedRect(x + pad, y + pad, s - pad * 2, s - pad * 2, r);
  ctx.fillStyle = grad;
  ctx.fill();

  // Bottom edge shadow
  ctx.fillStyle = darkenColor(color, 50);
  ctx.fillRect(x + pad + r, y + s - pad - 2, s - pad * 2 - r * 2, 2);

  // Specular highlight — upper-left arc
  ctx.save();
  ctx.globalAlpha = 0.35 * alpha;
  ctx.beginPath();
  ctx.ellipse(x + s * 0.38, y + s * 0.28, s * 0.25, s * 0.15, -0.3, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.restore();

  // Letter text with shadow
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 2;
  ctx.shadowOffsetY = 1;
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.floor(s * 0.45)}px "Segoe UI", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(letter, x + s / 2, y + s / 2 - 1);
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;

  // Point value
  ctx.font = `${Math.floor(s * 0.2)}px sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.textAlign = 'right';
  ctx.fillText(pts, x + s - pad - 2, y + s - pad - 3);

  ctx.restore();
}

function drawParticles() {
  for (let p of particles) {
    ctx.globalAlpha = Math.max(0, p.life * 1.5);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// SOUND ENGINE — Oscillator-based, no external dependencies
// ============================================================

const GAMELAB_MUTED = new URLSearchParams(window.location.search).has('mute');
let audioCtx = null;
let soundEnabled = STORAGE.get('sound') !== 'off';
let audioUnlocked = false;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended' && !GAMELAB_MUTED) audioCtx.resume();
  return audioCtx;
}

function unlockAudio() {
  if (audioUnlocked) return;
  const c = getAudioCtx();
  const buf = c.createBuffer(1, 1, 22050);
  const src = c.createBufferSource();
  src.buffer = buf;
  src.connect(c.destination);
  src.start(0);
  audioUnlocked = true;
}

// Pentatonic scale — column-to-pitch mapping
const WD_NOTES = [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3, 659.3];

// Word length → base frequency
const WORD_FREQ = { 3: 261.6, 4: 329.6, 5: 392.0, 6: 523.3, 7: 659.3 };
function wordBaseFreq(len) { return WORD_FREQ[Math.min(len, 7)] || 659.3; }

// Noise buffer — created once, reused for transient clicks
let _noiseBuf = null;
function getNoiseBuffer(c) {
  if (_noiseBuf) return _noiseBuf;
  _noiseBuf = c.createBuffer(1, 2048, c.sampleRate);
  const data = _noiseBuf.getChannelData(0);
  for (let i = 0; i < 2048; i++) data[i] = Math.random() * 2 - 1;
  return _noiseBuf;
}

// ── Shared helpers ──────────────────────────────────────────

function playTone(freq, opts = {}) {
  if (!soundEnabled) return;
  const c = getAudioCtx();
  const now = c.currentTime;
  const { type = 'sine', gain = 0.10, attack = 0.005, decay = 1.0, detune = 0 } = opts;
  const g = c.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(gain, now + attack);
  g.gain.exponentialRampToValueAtTime(0.001, now + decay);
  g.connect(c.destination);
  const osc = c.createOscillator();
  osc.type = type;
  osc.frequency.value = freq;
  if (detune) osc.detune.value = detune;
  osc.connect(g);
  osc.start(now);
  osc.stop(now + decay + 0.05);
}

function playChime(freq, len = 1.2, gain = 0.12) {
  if (!soundEnabled) return;
  const c = getAudioCtx();
  const now = c.currentTime;
  // Fundamental
  const master = c.createGain();
  master.gain.setValueAtTime(0, now);
  master.gain.linearRampToValueAtTime(gain, now + 0.006);
  master.gain.exponentialRampToValueAtTime(0.001, now + len);
  master.connect(c.destination);
  const osc1 = c.createOscillator();
  osc1.type = 'sine'; osc1.frequency.value = freq;
  osc1.connect(master); osc1.start(now); osc1.stop(now + len + 0.05);
  // Shimmer harmonic
  const g2 = c.createGain(); g2.gain.value = 0.25; g2.connect(master);
  const osc2 = c.createOscillator();
  osc2.type = 'sine'; osc2.frequency.value = freq * 2.005;
  osc2.connect(g2); osc2.start(now); osc2.stop(now + len * 0.7 + 0.05);
  // Sub-octave (mobile speaker presence)
  const g3 = c.createGain(); g3.gain.value = 0.08; g3.connect(master);
  const osc3 = c.createOscillator();
  osc3.type = 'sine'; osc3.frequency.value = freq * 0.5;
  osc3.connect(g3); osc3.start(now); osc3.stop(now + len * 0.5 + 0.05);
  // Simulated reverb tail
  const reverbG = c.createGain();
  reverbG.gain.setValueAtTime(0, now + 0.03);
  reverbG.gain.linearRampToValueAtTime(gain * 0.15, now + 0.04);
  reverbG.gain.exponentialRampToValueAtTime(0.001, now + len * 1.8);
  const lp = c.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = freq * 1.2;
  lp.connect(reverbG); reverbG.connect(c.destination);
  const osc4 = c.createOscillator();
  osc4.type = 'sine'; osc4.frequency.value = freq;
  osc4.connect(lp); osc4.start(now + 0.03); osc4.stop(now + len * 1.8 + 0.05);
}

function playNoiseBurst(centerFreq = 1200, gain = 0.08, duration = 0.04) {
  if (!soundEnabled) return;
  const c = getAudioCtx();
  const now = c.currentTime;
  const src = c.createBufferSource();
  src.buffer = getNoiseBuffer(c);
  const bp = c.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = centerFreq; bp.Q.value = 1.5;
  const g = c.createGain();
  g.gain.setValueAtTime(gain, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + duration);
  src.connect(bp); bp.connect(g); g.connect(c.destination);
  src.start(now); src.stop(now + duration + 0.01);
}

// ── Game Sound Events ───────────────────────────────────────

// §3.3 "Not a word" cue — a dull low descending buzz + noise thud.
// Deliberately unmusical (vs. the pentatonic land/clear tones) so it reads as "nope".
function playNotWordSound() {
  if (!soundEnabled) return;
  playNoiseBurst(200, 0.05, 0.08);
  const c = getAudioCtx();
  const now = c.currentTime;
  const g = c.createGain();
  g.gain.setValueAtTime(0.06, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
  g.connect(c.destination);
  const osc = c.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(180, now);
  osc.frequency.exponentialRampToValueAtTime(90, now + 0.14);
  osc.connect(g); osc.start(now); osc.stop(now + 0.16);
}

function sfxLetterLand(col) {
  if (!soundEnabled) return;
  const freq = WD_NOTES[Math.min(col, 7)];
  const c = getAudioCtx();
  const now = c.currentTime;
  const bp = c.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 3.5;
  bp.connect(c.destination);
  const g = c.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.07, now + 0.012);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
  g.connect(bp);
  const osc = c.createOscillator();
  osc.type = 'triangle'; osc.frequency.value = freq;
  osc.connect(g); osc.start(now); osc.stop(now + 0.07);
  playTone(freq * 0.5, { gain: 0.04, attack: 0.005, decay: 0.05 });
}

function sfxWordHighlight() {
  if (!soundEnabled) return;
  [261.6, 329.6, 392.0].forEach((f, i) => {
    setTimeout(() => playTone(f, { gain: 0.04, attack: 0.02, decay: 0.6 }), i * 60);
  });
}

function sfxWordClear(wordLen, chainDepth = 0) {
  if (!soundEnabled) return;
  const semitones = Math.min(chainDepth * 2, 6);
  const baseFreq = wordBaseFreq(wordLen) * Math.pow(2, semitones / 12);
  const dur = 0.7 + (wordLen - 3) * 0.25;
  const gain = 0.12 + Math.min(chainDepth * 0.015, 0.04);
  playChime(baseFreq, dur, gain);
  if (navigator.vibrate) {
    navigator.vibrate(wordLen >= 6 ? [30, 10, 30, 10, 50] : [20, 10, 30]);
  }
}

function sfxChainContinue(depth) {
  if (depth > 1) playNoiseBurst(800 + depth * 200, 0.06, 0.04);
}

function sfxLevelUp() {
  if (!soundEnabled) return;
  [392.0, 523.3, 659.3].forEach((f, i) => {
    setTimeout(() => playTone(f, { gain: 0.10, attack: 0.005, decay: 0.5 }), i * 90);
  });
}

function sfxGameOver() {
  if (!soundEnabled) return;
  [261.6, 196.0, 130.8].forEach((f, i) => {
    setTimeout(() => playChime(f, 2.0, 0.08), i * 400);
  });
}

function sfxPersonalBest() {
  if (!soundEnabled) return;
  WD_NOTES.slice(0, 6).forEach((f, i) => {
    setTimeout(() => {
      playChime(f, i === 5 ? 2.0 : 0.5, i === 5 ? 0.14 : 0.09);
      if (i === 5) playTone(f * 7.1, { gain: 0.04, attack: 0.01, decay: 1.5 });
    }, i * 80);
  });
}

// ── Ambient Engine ──────────────────────────────────────────
// Continuous drone, state-driven. Gains reduced ~60% from spec.
const WD_AMBIENT = {
  _ctx: null, _osc: null, _osc2: null, _lp: null, _masterGain: null,
  _state: 'silent',
  _configs: {
    calm:     [60, 400,  0.025, 0.5],
    building: [65, 700,  0.035, 1.0],
    tense:    [58, 350,  0.05,  2.5],
    danger:   [55, 250,  0.07,  5.0],
    release:  [80, 2000, 0.02,  0.3],
    silent:   [60, 400,  0.00,  0.5],
  },
  start() {
    if (!soundEnabled || this._masterGain) return;
    const c = getAudioCtx(); this._ctx = c;
    this._masterGain = c.createGain(); this._masterGain.gain.value = 0;
    this._masterGain.connect(c.destination);
    this._lp = c.createBiquadFilter();
    this._lp.type = 'lowpass'; this._lp.frequency.value = 400; this._lp.Q.value = 0.8;
    this._lp.connect(this._masterGain);
    this._osc = c.createOscillator(); this._osc.type = 'sine'; this._osc.frequency.value = 60;
    this._osc.connect(this._lp); this._osc.start();
    this._osc2 = c.createOscillator(); this._osc2.type = 'sine'; this._osc2.frequency.value = 60.5;
    const g2 = c.createGain(); g2.gain.value = 0.4;
    this._osc2.connect(g2); g2.connect(this._lp); this._osc2.start();
  },
  setState(newState) {
    if (!soundEnabled || newState === this._state) return;
    if (!this._masterGain) this.start();
    if (!this._masterGain) return;
    this._state = newState;
    const [freq, cutoff, gain, detuneHz] = this._configs[newState] || this._configs.calm;
    const now = this._ctx.currentTime;
    const tc = 0.5;
    this._osc.frequency.setTargetAtTime(freq, now, tc);
    this._osc2.frequency.setTargetAtTime(freq + detuneHz, now, tc);
    this._lp.frequency.setTargetAtTime(cutoff, now, tc);
    this._masterGain.gain.setTargetAtTime(gain, now, tc);
  },
  stop() { this.setState('silent'); }
};

function getBoardFillPct() {
  let filled = 0, total = COLS * ROWS;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (board[r][c] !== null) filled++;
  return filled / total;
}

// Topmost filled row in a column (small number = stacked near the top), or ROWS if empty.
function columnStackTop(col) {
  for (let r = 0; r < ROWS; r++) if (board[r][col] !== null) return r;
  return ROWS;
}

// 0..1 proximity to the REAL death condition, so the danger cues can line up with it.
// Freeplay tops out when the center spawn column blocks row 0 → watch that column.
// Daily jams when every column is full → watch the emptiest column (where you'd still drop).
const DANGER_ROWS = 3;
function getDeathProximity() {
  if (state !== 'playing') return 0;
  let watchTop;
  if (gameMode === 'freeplay') {
    watchTop = columnStackTop(Math.floor(COLS / 2));
  } else {
    watchTop = 0;
    for (let c = 0; c < COLS; c++) watchTop = Math.max(watchTop, columnStackTop(c));
  }
  if (watchTop <= 0) return 1;
  return Math.max(0, (DANGER_ROWS - watchTop) / DANGER_ROWS);
}

function updateAmbientFromBoard() {
  // Danger audio keys off real death proximity (the same signal as the red gradient) so the
  // scariest sound lines up with actually being about to lose. calm→tense still tracks
  // overall board fill as general escalation.
  if (getDeathProximity() >= 0.5) { WD_AMBIENT.setState('danger'); return; }
  const pct = getBoardFillPct();
  if (pct < 0.30) WD_AMBIENT.setState('calm');
  else if (pct < 0.60) WD_AMBIENT.setState('building');
  else WD_AMBIENT.setState('tense');
}

function triggerReleaseAmbient() {
  WD_AMBIENT.setState('release');
  setTimeout(() => updateAmbientFromBoard(), 1200);
}

// Sound toggle
function toggleSound() {
  soundEnabled = !soundEnabled;
  STORAGE.set('sound', soundEnabled ? 'on' : 'off');
  if (!soundEnabled) WD_AMBIENT.stop();
  else if (state === 'playing') { WD_AMBIENT.start(); updateAmbientFromBoard(); }
}

// ── Pause ──────────────────────────────────────────────────
// Freezing is automatic: the Daily timer and Freeplay auto-drop only advance inside the
// 'playing' branch of the game loop, so switching to 'paused' stops both. gameLoop keeps
// updating lastTime each frame, so resuming produces a normal dt (no jump). We only need to
// silence the ambient drone and restore it.
function togglePause() {
  if (state === 'playing') {
    state = 'paused';
    WD_AMBIENT.stop();
  } else if (state === 'paused') {
    state = 'playing';
    updateAmbientFromBoard();
  }
}

function drawSoundIcon(x, y, size) {
  ctx.save();
  ctx.strokeStyle = soundEnabled ? '#888' : '#555';
  ctx.fillStyle = soundEnabled ? '#888' : '#555';
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  // Speaker body
  const s = size;
  ctx.beginPath();
  ctx.moveTo(x + s * 0.15, y + s * 0.35);
  ctx.lineTo(x + s * 0.35, y + s * 0.35);
  ctx.lineTo(x + s * 0.55, y + s * 0.15);
  ctx.lineTo(x + s * 0.55, y + s * 0.85);
  ctx.lineTo(x + s * 0.35, y + s * 0.65);
  ctx.lineTo(x + s * 0.15, y + s * 0.65);
  ctx.closePath();
  ctx.fill();
  if (soundEnabled) {
    // Sound waves
    ctx.beginPath();
    ctx.arc(x + s * 0.55, y + s * 0.5, s * 0.18, -0.6, 0.6);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + s * 0.55, y + s * 0.5, s * 0.32, -0.5, 0.5);
    ctx.stroke();
  } else {
    // Mute X
    ctx.beginPath();
    ctx.moveTo(x + s * 0.65, y + s * 0.3);
    ctx.lineTo(x + s * 0.9, y + s * 0.7);
    ctx.moveTo(x + s * 0.9, y + s * 0.3);
    ctx.lineTo(x + s * 0.65, y + s * 0.7);
    ctx.stroke();
  }
  ctx.restore();
}

// Pause button — top-left corner. Generous hit region (see handleClick) for touch.
const PAUSE_BTN = { x: 8, y: 5, s: 22 };
function drawPauseButton() {
  const b = PAUSE_BTN;
  ctx.save();
  ctx.fillStyle = '#888';
  if (state === 'paused') {
    // Play triangle = resume
    ctx.beginPath();
    ctx.moveTo(b.x + b.s * 0.30, b.y + b.s * 0.20);
    ctx.lineTo(b.x + b.s * 0.30, b.y + b.s * 0.80);
    ctx.lineTo(b.x + b.s * 0.82, b.y + b.s * 0.50);
    ctx.closePath();
    ctx.fill();
  } else {
    // Two bars = pause
    const bw = b.s * 0.20;
    ctx.fillRect(b.x + b.s * 0.28, b.y + b.s * 0.22, bw, b.s * 0.56);
    ctx.fillRect(b.x + b.s * 0.54, b.y + b.s * 0.22, bw, b.s * 0.56);
  }
  ctx.restore();
}

function drawPauseOverlay() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.shadowColor = '#4d96ff';
  ctx.shadowBlur = 15;
  ctx.fillStyle = '#ffd93d';
  ctx.font = 'bold 34px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('PAUSED', W / 2, H / 2 - 12);
  ctx.restore();
  ctx.fillStyle = '#888';
  ctx.font = '15px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Press P or tap to resume', W / 2, H / 2 + 28);
}

let ambientUpdateCounter = 0;

// ── Game Loop ──────────────────────────────────────────────
function gameLoop(time) {
  const dt = Math.min(time - lastTime, 200);
  lastTime = time;
  const dtSec = dt / 1000;

  glowTime += dtSec;
  menuPulse += dtSec;

  // Clear with subtle animated radial gradient
  ctx.fillStyle = '#0c0c1a';
  ctx.fillRect(0, 0, W, H);
  const bgAlpha = 0.03 + Math.sin(glowTime * 0.5) * 0.015;
  const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.7);
  bgGrad.addColorStop(0, `rgba(77, 150, 255, ${bgAlpha})`);
  bgGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  if (state === 'howto') {
    drawHowToScreen();
    requestAnimationFrame(gameLoop);
    return;
  }

  if (state === 'menu') {
    drawMenuScreen();
    drawSoundIcon(W - 34, 4, 24);
    requestAnimationFrame(gameLoop);
    return;
  }

  if (state === 'mode_select') {
    drawModeSelectScreen();
    drawSoundIcon(W - 34, 4, 24);
    requestAnimationFrame(gameLoop);
    return;
  }

  if (state === 'game_over') {
    // Draw board in background
    drawBoard();
    drawParticles();
    drawGameOverScreen();
    drawSoundIcon(W - 34, 4, 24);
    requestAnimationFrame(gameLoop);
    return;
  }

  if (state === 'paused') {
    // Draw the frozen board + HUD under the overlay. No timer/drop/particle updates run,
    // so everything is held in place until resume.
    drawBoard();
    drawParticles();
    drawHUD();
    drawPauseOverlay();
    drawSoundIcon(W - 34, 4, 24);
    drawPauseButton();
    requestAnimationFrame(gameLoop);
    return;
  }

  // ── Playing state ──
  if (state === 'playing') {
    // Daily timer
    if (gameMode === 'daily' && dailyTimerActive) {
      dailyTimer -= dtSec;
      if (dailyTimer <= 0) {
        dailyTimer = 0;
        endGame();
        requestAnimationFrame(gameLoop);
        return;
      }
    }

    // Freeplay: auto-drop
    if (gameMode === 'freeplay' && !clearingAnimation) {
      dropTimer += dt;
      if (dropTimer >= dropInterval) {
        dropTimer = 0;
        if (letterY + 1 < ROWS && board[letterY + 1][letterX] === null) {
          letterY++;
        } else {
          placeFreeplayLetter();
        }
      }
    }

    // Score count-up tween (§3.2)
    if (displayScore !== scoreVal) {
      displayScore += (scoreVal - displayScore) * Math.min(1, dtSec * 9);
      if (Math.abs(scoreVal - displayScore) < 0.5) displayScore = scoreVal;
    }

    // Update "not a word" feedback
    if (notWordFeedback) {
      notWordFeedback.timer -= dtSec;
      if (notWordFeedback.timer <= 0) notWordFeedback = null;
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dtSec;
      p.y += p.vy * dtSec;
      p.vy += 100 * dtSec;
      p.life -= dtSec;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Decay discovery timers on highlighted words
    for (let hw of highlightedWords) {
      if (hw.discoveryTimer > 0) hw.discoveryTimer = Math.max(0, hw.discoveryTimer - dtSec);
    }

    // Update ambient every ~30 frames
    ambientUpdateCounter++;
    if (ambientUpdateCounter >= 30) {
      ambientUpdateCounter = 0;
      updateAmbientFromBoard();
    }

    drawBoard();
    drawParticles();

    // "Not a word" floating feedback
    if (notWordFeedback) {
      const nf = notWordFeedback;
      const rise = (1 - nf.timer) * 30;
      ctx.save();
      ctx.globalAlpha = Math.min(1, nf.timer * 2);
      ctx.fillStyle = '#ff6b6b';
      ctx.font = 'bold 13px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Not a word', nf.x, nf.y - rise);
      ctx.restore();
    }

    drawHUD();

    // Sound icon (drawn on top of everything, always visible during play)
    drawSoundIcon(W - 34, 4, 24);
    drawPauseButton();
  }

  requestAnimationFrame(gameLoop);
}

// ── Start ──────────────────────────────────────────────────
lastTime = performance.now();
requestAnimationFrame(gameLoop);

</script>
